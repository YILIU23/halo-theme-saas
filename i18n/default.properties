# 静态资源版本号 —— assetRev 的唯一来源。
# Halo 对 /themes/** 下发 Cache-Control: max-age=31536000, 资源内容变化必须换 URL 才能失效。
# 发版时只需改这里, 并同步 theme.yaml 的 spec.version; 三个布局模板都通过 #{asset.rev} 取用。
# 为什么不用 theme.spec.version: 该值取自数据库里已登记的 Theme 记录, 直接覆盖主题文件后
# 若未在 Console 重载, 它会停留在旧版本, 浏览器就会一直命中旧 CSS/JS。
asset.rev=1.4.2
