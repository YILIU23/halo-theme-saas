<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(head = ~{modules/post-body :: head(post = ${post})}, content = ~{modules/post-body :: content(post = ${post}, variant = '')}, aside = ~{modules/post-body :: asideFull(post = ${post})}, hasAside = ${(not (#annotations.getOrDefault(post, 'hideToc', '') == 'true') and (theme.config.appearance?.enable_toc ?: true)) or (theme.config.sidebar?.show_recent ?: true) or not #lists.isEmpty(categoryFinder.listAsTree()) or not #lists.isEmpty(tagFinder.listAll())})}"
></html>
