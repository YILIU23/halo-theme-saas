<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(head = ~{::head}, content = ~{::content}, aside = null, hasAside = false)}"
>
  <!--
    内置搜索页。
    用法: 后台新建一个独立页面 (例如标题「搜索」, 别名 search), 在「自定义模板」
    里选择「搜索页」, 然后在主题设置 → 搜索里打开「启用内置搜索页」。
    这样即使没装搜索插件, 顶栏的放大镜也有地方可去。

    数据来源是 Halo 的公开内容接口 /apis/api.content.halo.run/v1alpha1/posts,
    匿名可读; 但该接口只返回标题、摘要、分类、标签, 不返回正文,
    所以这里搜的是「标题 + 摘要 + 分类名 + 标签名」, 不是全文检索。
    全文检索请安装官方的搜索插件。
  -->
  <th:block th:fragment="head">
    <!--
      这个模板可能被两条路走到:
      1. 装了搜索插件时, /search 由插件提供, 主题的 search.html 被拿来渲染,
         此时上下文里没有 singlePage 对象;
      2. 没装插件时, 作者自建独立页面并选「搜索页」模板, 此时有 singlePage。
      所以这里一切对 singlePage 的访问都必须判空。
    -->
    <th:block th:with="searchTitle = #{search.title}">
      <title th:text="${searchTitle + ' - ' + site.title}">Search</title>
      <th:block
        th:replace="~{modules/seo :: meta(type = 'website', title = ${searchTitle}, description = null, path = ${singlePage?.status?.permalink}, image = null, author = null, published = null, modified = null)}"
      />
    </th:block>
  </th:block>

  <th:block th:fragment="content">
    <div class="page-head">
      <p class="page-head-label" th:text="#{search.title}">Search</p>
      <h1 th:text="#{search.title}">Search</h1>
    </div>

    <div
      class="search-panel"
      id="search-panel"
      th:attr="data-endpoint='/apis/api.content.halo.run/v1alpha1/posts',
               data-size='200',
               data-msg-hint=#{search.hint},
               data-msg-empty=#{search.empty},
               data-msg-loading=#{search.loading},
               data-msg-results=#{search.results},
               data-msg-failed=#{search.failed}"
    >
      <div class="search-field">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        ><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <input
          type="search"
          id="search-input"
          class="search-input"
          autocomplete="off"
          th:attr="placeholder=#{search.placeholder}, aria-label=#{search.placeholder}"
        />
      </div>

      <p class="search-status" id="search-status" aria-live="polite" th:text="#{search.hint}"></p>
      <ol class="search-results" id="search-results"></ol>
    </div>

    <!-- 页面正文放在结果下方: 作者可以在页面里补充说明 (插件路由下没有页面对象) -->
    <div
      class="post-content search-page-body"
      th:if="${singlePage != null and not #strings.isEmpty(singlePage.content.content)}"
      th:utext="${singlePage.content.content}"
    ></div>
  </th:block>
</html>
