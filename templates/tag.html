<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(head = ~{::head}, content = ~{::content}, aside = ~{::aside})}"
>
  <th:block th:fragment="head">
    <title th:text="|${tag.spec.displayName} - ${site.title}|"></title>
    <th:block
      th:replace="~{modules/seo :: meta(type = 'website', title = ${tag.spec.displayName + ' - ' + site.title}, description = null, path = ${posts.page > 1 ? null : tag.status.permalink}, image = ${tag.spec.cover}, author = null, published = null, modified = null)}"
    />
  </th:block>

  <th:block th:fragment="content">
    <div class="page-head">
      <p class="page-head-label" th:text="#{tag.title}">Tag</p>
      <h1 th:text="|# ${tag.spec.displayName}|"></h1>
      <p class="page-head-desc" th:text="#{tag.postCount(${tag.postCount})}"></p>
    </div>

    <div class="entry-list" th:if="${not #lists.isEmpty(posts.items)}">
      <th:block th:each="post : ${posts.items}">
        <th:block th:replace="~{modules/post-entry :: entry(post = ${post})}" />
      </th:block>
    </div>

    <p class="empty-tip" th:if="${#lists.isEmpty(posts.items)}" th:text="#{tag.empty}"></p>

    <th:block th:replace="~{modules/pagination :: pagination(result = ${posts})}" />
  </th:block>

  <th:block th:fragment="aside">
    <th:block th:replace="~{widgets :: tags}" />
    <th:block th:replace="~{widgets :: categories}" />
  </th:block>
</html>
