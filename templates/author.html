<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(head = ~{::head}, content = ~{::content}, aside = ~{::aside})}"
>
  <th:block th:fragment="head">
    <title th:text="|${author.spec.displayName} - ${site.title}|"></title>
    <th:block
      th:replace="~{modules/seo :: meta(type = 'profile', title = ${author.spec.displayName + ' - ' + site.title}, description = ${author.spec.bio}, path = ${posts.page > 1 ? null : author.status.permalink}, image = ${author.spec.avatar}, author = null, published = null, modified = null)}"
    />
  </th:block>

  <th:block th:fragment="content">
    <div class="page-head author-head">
      <img
        th:if="${not #strings.isEmpty(author.spec.avatar)}"
        th:src="${author.spec.avatar}"
        th:alt="${author.spec.displayName}"
        class="widget-avatar"
      />
      <div>
        <p class="page-head-label" th:text="#{author.title}">Author</p>
        <h1 th:text="${author.spec.displayName}"></h1>
        <p
          class="page-head-desc"
          th:if="${not #strings.isEmpty(author.spec.bio)}"
          th:text="${author.spec.bio}"
        ></p>
        <p
          class="page-head-desc"
          th:if="${author.spec.registeredAt != null}"
          th:text="#{author.joined(${#temporals.format(author.spec.registeredAt, 'yyyy-MM-dd')})}"
        ></p>
      </div>
    </div>

    <div class="post-grid" th:if="${not #lists.isEmpty(posts.items)}">
      <th:block th:each="post : ${posts.items}">
        <th:block th:replace="~{modules/post-card :: card(post = ${post})}" />
      </th:block>
    </div>

    <p class="empty-tip" th:if="${#lists.isEmpty(posts.items)}" th:text="#{author.empty}"></p>

    <th:block th:replace="~{modules/pagination :: pagination(result = ${posts})}" />
  </th:block>

  <th:block th:fragment="aside">
    <th:block th:replace="~{widgets :: stats}" />
    <th:block th:replace="~{widgets :: recent}" />
    <th:block th:replace="~{widgets :: categories}" />
    <th:block th:replace="~{widgets :: tags}" />
  </th:block>
</html>
