<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(head = ~{::head}, content = ~{::content}, aside = null)}"
>
  <th:block th:fragment="head">
    <title th:text="|#{tags.title} - ${site.title}|">Tags</title>
  </th:block>

  <th:block th:fragment="content">
    <div class="page-head">
      <h1 th:text="#{tags.title}">Tags</h1>
    </div>

    <!-- tags 是 List<TagVo>, 没有分页 -->
    <div class="widget-tags tag-cloud" th:if="${not #lists.isEmpty(tags)}">
      <a
        th:each="tag : ${tags}"
        th:href="@{${tag.status.permalink}}"
        th:text="${tag.spec.displayName}"
        th:attr="title=${#strings.concat(tag.spec.displayName, ' (', tag.postCount, ')')}"
        class="tag-chip"
      ></a>
    </div>

    <p class="empty-tip" th:if="${#lists.isEmpty(tags)}" th:text="#{tags.empty}"></p>
  </th:block>
</html>
