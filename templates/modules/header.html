<th:block xmlns:th="https://www.thymeleaf.org">
  <header th:fragment="header" class="site-header">
    <a class="skip-link" href="#main" th:text="#{nav.skip}">跳到正文</a>
    <div class="container header-inner">
      <a class="brand" th:href="@{/}">
        <img
          th:if="${not #strings.isEmpty(site.logo)}"
          th:src="${site.logo}"
          th:alt="${site.title}"
          class="brand-logo"
        />
        <span th:text="${site.title}" class="brand-title">Site Title</span>
      </a>

      <nav
        class="site-nav"
        id="site-nav"
        aria-label="Primary"
        th:with="menuItems = ${menuFinder.getPrimary()?.menuItems ?: {}}"
      >
        <div
          class="nav-item"
          th:each="item : ${menuItems}"
          th:classappend="${not #lists.isEmpty(item.children)} ? 'has-children'"
        >
          <a
            th:href="@{${item.status.href}}"
            th:text="${item.status.displayName}"
            th:target="${item.spec.target?.value}"
          ></a>
          <div class="nav-sub" th:if="${not #lists.isEmpty(item.children)}">
            <a
              th:each="child : ${item.children}"
              th:href="@{${child.status.href}}"
              th:text="${child.status.displayName}"
              th:target="${child.spec.target?.value}"
            ></a>
          </div>
        </div>
      </nav>

      <div class="header-actions">
        <button
          th:if="${pluginFinder.available('PluginSearchWidget')}"
          type="button"
          class="icon-btn"
          aria-label="Search"
          th:attr="aria-label=#{nav.search}"
          onclick="SearchWidget.open()"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button
          type="button"
          class="icon-btn"
          id="theme-toggle"
          aria-label="Toggle dark mode"
          th:attr="aria-label=#{nav.toggleTheme}"
        >
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <button
          type="button"
          class="icon-btn nav-burger"
          id="nav-toggle"
          aria-label="Menu"
          th:attr="aria-label=#{nav.menu}"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>
</th:block>
