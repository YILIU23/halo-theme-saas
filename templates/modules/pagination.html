<th:block xmlns:th="https://www.thymeleaf.org">
  <th:block th:fragment="pagination(result)">
    <nav
      class="pagination"
      th:if="${result != null and (result.hasPrevious() or result.hasNext())}"
      th:attr="aria-label=#{pagination.label}"
    >
      <a
        class="page-btn"
        th:if="${result.hasPrevious()}"
        th:href="@{${result.prevUrl}}"
        rel="prev"
        th:text="|← #{pagination.previous}|"
      >← Previous</a>
      <span
        class="page-info"
        th:text="#{pagination.info(${result.page}, ${result.totalPages})}"
      >Page 1 of 1</span>
      <a
        class="page-btn"
        th:if="${result.hasNext()}"
        th:href="@{${result.nextUrl}}"
        rel="next"
        th:text="|#{pagination.next} →|"
      >Next →</a>
    </nav>
  </th:block>
</th:block>
